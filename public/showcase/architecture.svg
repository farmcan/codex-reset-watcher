2" y="909" font-size="16" fill="#766971" font-weight="400">系统边界：Cloudflare Worker + D1；外部依赖：X、Qwen、钉钉。</text><line x1="60" y1="928" x2="1540" y2="928" stroke="#e3cdd9"/><text x="60" y="957" font-size="16" fill="#766971" font-weight="400">原帖时间 ≠ 精确执行时间；公开确认 ≠ 每个账号已到账。</text><text x="60" y="986" font-size="14" fill="#766971" font-weight="400">Dot → Codex 自动开工未启用。图中不展示未来能力为已上线链路。</text><text x="1540" y="957" font-size="14" fill="#766971" font-weight="400" text-anchor="end">2026-10-30</text></g></svg>