<title id="title">Codex Reset Watcher — deployment architecture</title><desc id="desc">One Cloudflare Worker ingests public X posts, checks evidence with Qwen, stores records in D1, serves the web and RSS, and delivers selected-recipient DING and group mentions. Dot automation is not enabled.</desc>
