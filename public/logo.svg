<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Codex reset watcher whip-strike mark</title>
  <desc id="desc">A playful golden whip visibly striking a white Codex-style knot, with a bright impact spark.</desc>
  <defs>
    <linearGradient id="bg" x1="46" y1="38" x2="462" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#203329"/>
      <stop offset="1" stop-color="#101914"/>
    </linearGradient>
    <linearGradient id="leather" x1="79" y1="430" x2="421" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5423"/>
      <stop offset=".42" stop-color="#e8ad57"/>
      <stop offset="1" stop-color="#ffcf78"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#07100b" flood-opacity=".38"/>
    </filter>
    <filter id="spark-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <path d="M42 161C81 103 132 65 194 47" fill="none" stroke="#335044" stroke-width="9" stroke-linecap="round" opacity=".55"/>
  <path d="M46 193C83 146 124 115 170 98" fill="none" stroke="#335044" stroke-width="6" stroke-linecap="round" opacity=".42"/>

  <g filter="url(#soft-shadow)">
    <circle cx="326" cy="299" r="130" fill="#1d2d25" stroke="#3c5849" stroke-width="5"/>
    <circle cx="326" cy="299" r="108" fill="#15231b" stroke="#294438" stroke-width="3"/>
    <g fill="none" stroke="#f7faf7" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
      <rect x="299" y="207" width="54" height="184" rx="27" transform="rotate(0 326 299)"/>
      <rect x="299" y="207" width="54" height="184" rx="27" transform="rotate(60 326 299)"/>
      <rect x="299" y="207" width="54" height="184" rx="27" transform="rotate(120 326 299)"/>
    </g>
    <circle cx="326" cy="299" r="28" fill="#15231b" stroke="#f7faf7" stroke-width="11"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M139 350C84 281 87 181 158 116C226 54 344 50 407 109C447 146 446 201 415 226C385 250 349 240 327 222C309 207 292 210 278 229" stroke="#3b2412" stroke-width="22" opacity=".72"/>
    <path d="M139 345C87 278 92 186 161 122C229 60 338 57 400 114C437 148 437 194 410 216C384 237 354 229 333 212C309 192 286 202 269 226" stroke="url(#leather)" stroke-width="12"/>
    <path d="M271 224C260 231 253 238 247 247" stroke="#ffd683" stroke-width="7"/>
  </g>

  <g transform="rotate(-43 123 372)" filter="url(#soft-shadow)">
    <rect x="96" y="326" width="54" height="135" rx="24" fill="#75431d" stroke="#f0b35b" stroke-width="7"/>
    <path d="M108 343H139M105 364H142M104 385H143M105 406H142M109 427H138" stroke="#311f12" stroke-width="9" stroke-linecap="round"/>
    <rect x="104" y="441" width="38" height="43" rx="16" fill="#d28a38"/>
  </g>

  <g transform="translate(251 239)" filter="url(#spark-glow)">
    <path d="M0-32L9-11L31-17L15 1L34 14L10 12L5 35L-5 14L-27 24L-14 4L-36-5L-11-8Z" fill="#c9ff68" stroke="#fff4a6" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="#d9ff84" stroke-width="8" stroke-linecap="round">
    <path d="M225 209L207 187"/>
    <path d="M217 239L187 238"/>
    <path d="M236 265L220 289"/>
  </g>
</svg>
